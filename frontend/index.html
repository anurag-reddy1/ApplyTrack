<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApplyTrack — Sign In</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🎯</text></svg>" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <main class="auth-container">
      <div class="auth-brand">
        <span class="brand-icon">🎯</span>
        <h1 class="brand-name">ApplyTrack</h1>
        <p class="brand-tagline">Your recruitment pipeline, organized.</p>
      </div>

      <!-- Login Form -->
      <section class="auth-card" id="login-section">
        <h2 class="auth-title">Sign In</h2>
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email">Email</label>
            <input
              type="email"
              id="login-email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="Your password"
              autocomplete="current-password"
              required
            />
          </div>
          <div class="form-error" id="login-error" aria-live="polite"></div>
          <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign In</button>
        </form>
        <p class="auth-switch">
          Don't have an account?
          <button type="button" class="btn-link" id="show-register">Create one</button>
        </p>
      </section>

      <!-- Register Form -->
      <section class="auth-card hidden" id="register-section">
        <h2 class="auth-title">Create Account</h2>
        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="reg-username">Name</label>
            <input
              type="text"
              id="reg-username"
              name="username"
              placeholder="Your name"
              autocomplete="name"
              required
            />
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input
              type="email"
              id="reg-email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input
              type="password"
              id="reg-password"
              name="password"
              placeholder="Choose a password"
              autocomplete="new-password"
              required
            />
          </div>
          <div class="form-error" id="register-error" aria-live="polite"></div>
          <button type="submit" class="btn btn-primary btn-full" id="register-btn">
            Create Account
          </button>
        </form>
        <p class="auth-switch">
          Already have an account?
          <button type="button" class="btn-link" id="show-login">Sign in</button>
        </p>
      </section>
    </main>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
