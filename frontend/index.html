<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApplyTrack — Sign In</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🎯</text></svg>" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="d-flex align-items-center justify-content-center min-vh-100">
    <main class="auth-container">
      <!-- Brand -->
      <div class="text-center mb-4">
        <div class="brand-icon">🎯</div>
        <h1 class="brand-name">ApplyTrack</h1>
        <p class="brand-tagline">Your recruitment pipeline, organized.</p>
      </div>

      <!-- Login Form -->
      <section class="card auth-card" id="login-section">
        <div class="card-body">
          <h2 class="fs-5 fw-bold mb-4">Sign In</h2>
          <form id="login-form" novalidate>
            <div class="mb-3">
              <label for="login-email" class="form-label">Email</label>
              <input
                type="email"
                id="login-email"
                name="email"
                class="form-control"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </div>
            <div class="mb-3">
              <label for="login-password" class="form-label">Password</label>
              <input
                type="password"
                id="login-password"
                name="password"
                class="form-control"
                placeholder="Your password"
                autocomplete="current-password"
                required
              />
            </div>
            <div class="form-error text-danger small mb-2" id="login-error" aria-live="polite"></div>
            <button type="submit" class="btn btn-primary w-100" id="login-btn">Sign In</button>
          </form>
          <p class="text-center small mt-3 mb-0" style="color: var(--color-text-3);">
            Don't have an account?
            <button type="button" class="btn btn-link p-0" id="show-register">Create one</button>
          </p>
        </div>
      </section>

      <!-- Register Form -->
      <section class="card auth-card d-none" id="register-section">
        <div class="card-body">
          <h2 class="fs-5 fw-bold mb-4">Create Account</h2>
          <form id="register-form" novalidate>
            <div class="mb-3">
              <label for="reg-username" class="form-label">Name</label>
              <input
                type="text"
                id="reg-username"
                name="username"
                class="form-control"
                placeholder="Your name"
                autocomplete="name"
                required
              />
            </div>
            <div class="mb-3">
              <label for="reg-email" class="form-label">Email</label>
              <input
                type="email"
                id="reg-email"
                name="email"
                class="form-control"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </div>
            <div class="mb-3">
              <label for="reg-password" class="form-label">Password</label>
              <input
                type="password"
                id="reg-password"
                name="password"
                class="form-control"
                placeholder="Choose a password"
                autocomplete="new-password"
                required
              />
            </div>
            <div class="form-error text-danger small mb-2" id="register-error" aria-live="polite"></div>
            <button type="submit" class="btn btn-primary w-100" id="register-btn">
              Create Account
            </button>
          </form>
          <p class="text-center small mt-3 mb-0" style="color: var(--color-text-3);">
            Already have an account?
            <button type="button" class="btn btn-link p-0" id="show-login">Sign in</button>
          </p>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
