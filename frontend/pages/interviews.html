<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interviews | ApplyTrack</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🎯</text></svg>"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/interviews.css" />
  </head>
  <body>
    <nav class="navbar sticky-top nav-header">
      <div class="nav-inner">
        <a class="navbar-brand nav-brand" href="./dashboard.html"
          >🎯 ApplyTrack</a
        >
        <div class="d-flex align-items-center gap-3">
          <a href="./dashboard.html" class="nav-link-custom">Pipeline</a>
          <a href="./interviews.html" class="nav-link-custom active"
            >Interviews</a
          >
          <a href="./networking.html" class="nav-link-custom">Networking</a>
          <span class="nav-username" id="nav-username"></span>
          <button
            type="button"
            class="btn btn-outline-secondary btn-sm"
            id="sign-out-btn"
          >
            Sign Out
          </button>
        </div>
      </div>
    </nav>

    <main class="page">
      <header class="page__header">
        <div>
          <h1 class="page__title">Interview Prep</h1>
          <p class="page__subtitle">
            Track rounds, notes, and outcomes for every interview.
          </p>
        </div>
        <button class="btn btn-primary" id="add-btn">+ Add Interview</button>
      </header>

      <div class="filter-bar">
        <button class="filter-pill filter-pill--active" data-filter="">
          All
        </button>
        <button class="filter-pill" data-filter="Upcoming">Upcoming</button>
        <button class="filter-pill" data-filter="Completed">Completed</button>
        <button class="filter-pill" data-filter="Cancelled">Cancelled</button>
        <div class="filter-bar__spacer"></div>
        <input
          class="form-control search-input"
          id="search-input"
          type="search"
          placeholder="Search company or role…"
        />
      </div>

      <div class="card table-card">
        <div class="table-responsive">
          <table class="table table-hover mb-0" id="interviews-table">
            <thead>
              <tr>
                <th class="sortable" data-col="company">
                  COMPANY <span class="sort-icon">↕</span>
                </th>
                <th class="sortable" data-col="role">
                  ROLE <span class="sort-icon">↕</span>
                </th>
                <th class="sortable" data-col="round">
                  ROUND <span class="sort-icon">↕</span>
                </th>
                <th class="sortable" data-col="status">
                  STATUS <span class="sort-icon">↕</span>
                </th>
                <th class="sortable" data-col="date">
                  DATE <span class="sort-icon">↓</span>
                </th>
                <th class="sortable" data-col="result">
                  RESULT <span class="sort-icon">↕</span>
                </th>
                <th>ACTIONS</th>
              </tr>
            </thead>
            <tbody id="interviews-tbody">
              <tr id="iv-loading">
                <td colspan="7" class="empty-row">Loading…</td>
              </tr>
              <tr id="iv-empty" hidden>
                <td colspan="7" class="empty-row">No interviews found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div id="iv-pagination" class="pagination-nav mt-3"></div>
    </main>

    <!-- Detail / Prep Notes Panel -->
    <aside class="notes-panel" id="notes-panel" hidden>
      <div class="notes-panel__header">
        <h3 class="notes-panel__title" id="panel-title">Prep Notes</h3>
        <button class="icon-btn" id="panel-close">✕</button>
      </div>
      <div class="notes-panel__body" id="panel-body"></div>
    </aside>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay" hidden>
      <div
        class="modal-box"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <div class="modal-box__header">
          <h2 class="modal-box__title" id="modal-title">Add Interview</h2>
          <button class="icon-btn" id="modal-close">✕</button>
        </div>
        <div class="modal-box__body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="f-company">Company *</label>
              <input
                class="form-control"
                id="f-company"
                type="text"
                placeholder="e.g. Google"
              />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="f-role">Role *</label>
              <input
                class="form-control"
                id="f-role"
                type="text"
                placeholder="e.g. SWE Intern"
              />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="f-round">Round *</label>
              <select class="form-select" id="f-round">
                <option value="Phone Screen">Phone Screen</option>
                <option value="Technical 1">Technical 1</option>
                <option value="Technical 2">Technical 2</option>
                <option value="Behavioral">Behavioral</option>
                <option value="Final Round">Final Round</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="f-date">Date &amp; Time</label>
              <input class="form-control" id="f-date" type="datetime-local" />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="f-status">Status</label>
              <select class="form-select" id="f-status">
                <option value="Upcoming">Upcoming</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="f-result">Result</label>
              <select class="form-select" id="f-result">
                <option value="Pending">Pending</option>
                <option value="Pass">Pass</option>
                <option value="Fail">Fail</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="f-interviewer"
                >Interviewer Name</label
              >
              <input
                class="form-control"
                id="f-interviewer"
                type="text"
                placeholder="e.g. Jane Smith"
              />
            </div>
            <div class="col-12">
              <label class="form-label" for="f-tech"
                >Technical Prep Notes</label
              >
              <textarea
                class="form-control"
                id="f-tech"
                rows="4"
                placeholder="Topics, LeetCode patterns, system design notes…"
              ></textarea>
            </div>
            <div class="col-12">
              <label class="form-label" for="f-behavioral"
                >Behavioral Prep Notes</label
              >
              <textarea
                class="form-control"
                id="f-behavioral"
                rows="4"
                placeholder="STAR stories, questions to ask…"
              ></textarea>
            </div>
          </div>
          <div class="text-danger small mt-2" id="form-error" hidden></div>
        </div>
        <div class="modal-box__footer">
          <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
          <button class="btn btn-primary" id="save-btn">Save</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/interviews.js"></script>
  </body>
</html>
