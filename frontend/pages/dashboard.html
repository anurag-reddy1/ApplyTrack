<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApplyTrack — Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🎯</text></svg>" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>
  <body>

    <!-- Navigation -->
    <nav class="navbar sticky-top nav-header">
      <div class="nav-inner">
        <a class="navbar-brand nav-brand" href="dashboard.html">🎯 ApplyTrack</a>
        <div class="d-flex align-items-center gap-3">
          <a href="dashboard.html" class="nav-link-custom active">Pipeline</a>
          <span class="nav-username" id="nav-username">Loading...</span>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="logout-btn">Sign Out</button>
        </div>
      </div>
    </nav>

    <main class="dashboard-main">

      <!-- Metrics Bar -->
      <section aria-label="Application Metrics">
        <div class="row g-3">
          <div class="col-6 col-md-3">
            <div class="card metric-card h-100" id="metric-total">
              <div class="card-body">
                <div class="metric-value">—</div>
                <div class="metric-label">Total Applied</div>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="card metric-card h-100" id="metric-interviews">
              <div class="card-body">
                <div class="metric-value">—</div>
                <div class="metric-label">In Interview</div>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="card metric-card h-100" id="metric-offers">
              <div class="card-body">
                <div class="metric-value">—</div>
                <div class="metric-label">Offers</div>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="card metric-card h-100" id="metric-rate">
              <div class="card-body">
                <div class="metric-value">—</div>
                <div class="metric-label">Response Rate</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Pipeline Controls -->
      <section class="d-flex justify-content-between align-items-start flex-wrap gap-3">
        <div class="d-flex flex-column gap-2">
          <h2 class="section-title">My Pipeline</h2>
          <div class="filter-tabs" id="filter-tabs" role="tablist" aria-label="Filter by status">
            <button type="button" class="filter-tab active" data-status="all" role="tab" aria-selected="true">All</button>
            <button type="button" class="filter-tab" data-status="Wishlist" role="tab" aria-selected="false">Wishlist</button>
            <button type="button" class="filter-tab" data-status="Applied" role="tab" aria-selected="false">Applied</button>
            <button type="button" class="filter-tab" data-status="Phone Screen" role="tab" aria-selected="false">Phone Screen</button>
            <button type="button" class="filter-tab" data-status="Technical Interview" role="tab" aria-selected="false">Technical</button>
            <button type="button" class="filter-tab" data-status="Final Round" role="tab" aria-selected="false">Final Round</button>
            <button type="button" class="filter-tab" data-status="Offer" role="tab" aria-selected="false">Offer</button>
            <button type="button" class="filter-tab" data-status="Rejected" role="tab" aria-selected="false">Rejected</button>
            <button type="button" class="filter-tab" data-status="Withdrawn" role="tab" aria-selected="false">Withdrawn</button>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <input
            type="search"
            id="search-input"
            class="form-control search-input"
            placeholder="Search company or role…"
            aria-label="Search applications"
          />
          <button type="button" class="btn btn-primary text-nowrap" id="add-app-btn">+ Add Application</button>
        </div>
      </section>

      <!-- Applications Table -->
      <section aria-label="Applications list">
        <div class="card table-card">
          <div class="table-responsive position-relative" style="min-height: 200px;">
            <table class="table table-hover mb-0" id="app-table">
              <thead>
                <tr>
                  <th scope="col" class="sortable" data-col="company">Company <span class="sort-icon">↕</span></th>
                  <th scope="col" class="sortable" data-col="role">Role <span class="sort-icon">↕</span></th>
                  <th scope="col" class="sortable" data-col="status">Status <span class="sort-icon">↕</span></th>
                  <th scope="col" class="sortable" data-col="salary">Salary <span class="sort-icon">↕</span></th>
                  <th scope="col" class="sortable" data-col="appliedDate">Applied <span class="sort-icon">↓</span></th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody id="app-table-body">
                <!-- Rows injected by JS -->
              </tbody>
            </table>
            <div class="table-empty d-none" id="table-empty">
              <p class="empty-icon">📋</p>
              <p class="empty-title">No applications yet</p>
              <p class="empty-sub">Click <strong>+ Add Application</strong> to start tracking your pipeline.</p>
            </div>
            <div class="table-loading" id="table-loading" aria-live="polite">
              <span class="spinner" aria-hidden="true"></span>
              <span>Loading applications…</span>
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- Application Modal -->
    <div class="modal fade" id="app-modal" tabindex="-1" aria-labelledby="modal-title" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content app-modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="modal-title">Add Application</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="app-form" novalidate>
            <input type="hidden" id="app-id" />
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="field-company" class="form-label">Company <span class="text-danger">*</span></label>
                  <input type="text" id="field-company" name="company" class="form-control" placeholder="e.g. Google" required />
                </div>
                <div class="col-md-6">
                  <label for="field-role" class="form-label">Role <span class="text-danger">*</span></label>
                  <input type="text" id="field-role" name="role" class="form-control" placeholder="e.g. Software Engineer Intern" required />
                </div>
                <div class="col-md-6">
                  <label for="field-status" class="form-label">Status</label>
                  <select id="field-status" name="status" class="form-select">
                    <option value="Wishlist">Wishlist</option>
                    <option value="Applied">Applied</option>
                    <option value="Phone Screen">Phone Screen</option>
                    <option value="Technical Interview">Technical Interview</option>
                    <option value="Final Round">Final Round</option>
                    <option value="Offer">Offer</option>
                    <option value="Rejected">Rejected</option>
                    <option value="Withdrawn">Withdrawn</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="field-salary" class="form-label">Salary / Hourly</label>
                  <input type="text" id="field-salary" name="salary" class="form-control" placeholder="e.g. $85,000 or $35/hr" />
                </div>
                <div class="col-md-6">
                  <label for="field-applied-date" class="form-label">Date Applied</label>
                  <input type="date" id="field-applied-date" name="appliedDate" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label for="field-job-link" class="form-label">Job Posting URL</label>
                  <input type="url" id="field-job-link" name="jobLink" class="form-control" placeholder="https://…" />
                </div>
                <div class="col-12">
                  <label for="field-notes" class="form-label">Notes</label>
                  <textarea id="field-notes" name="notes" class="form-control" rows="3" placeholder="Recruiter name, referral, key details…"></textarea>
                </div>
              </div>
              <div class="text-danger small mt-2" id="modal-error" aria-live="polite"></div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" id="modal-cancel-btn" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary" id="modal-submit-btn">Save Application</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-custom d-none" id="toast" role="alert" aria-live="assertive"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/dashboard.js"></script>
  </body>
</html>
